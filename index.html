<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>Okanlawon — UI Designer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: cinematic dark stage. Pure black ground, oversized uppercase grotesk set left, the designer's portrait "forged in light" with a red rim glow on the right; everything below stays quiet and monochrome with red used only for light. */
:root{
  --bg:#050505; --bg-2:#0B0B0C; --card:#101012; --ink:#F3F3F1; --muted:#8E8E94; --line:#232327;
  --red:#FF3B2F; --red-2:#FF7A45; --glow:rgba(255,59,47,.55); --glow-soft:rgba(255,59,47,.12);
  --ok:#3DDC84; --danger:#FF5A5A;
  --f-display:"Schibsted Grotesk","Helvetica Neue",Arial,sans-serif;
  --f-body:"Schibsted Grotesk","Helvetica Neue",Arial,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font:16px/1.6 var(--f-body)}
a{color:inherit}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--red);outline-offset:3px}
::selection{background:var(--red);color:#fff}
.wrap{max-width:1240px;margin:0 auto;padding-inline:clamp(16px,4vw,48px)}
section{overflow-x:clip;padding-block:clamp(64px,10vw,130px);scroll-margin-top:70px;position:relative}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
h2{font-size:clamp(36px,5.6vw,72px);line-height:.95;font-weight:500;text-transform:uppercase;letter-spacing:-.025em}
.eyebrow{font:500 11px/1.3 var(--f-mono);text-transform:uppercase;letter-spacing:.14em;color:var(--muted);display:flex;align-items:center;gap:10px;margin-bottom:18px}
.eyebrow::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--red);box-shadow:0 0 10px var(--red)}
.hand{font:500 11px/1.3 var(--f-mono);text-transform:uppercase;letter-spacing:.14em;color:var(--muted)}
.hl{color:var(--red);text-shadow:0 0 28px var(--glow)}
.sec-head{display:flex;justify-content:space-between;align-items:end;gap:16px 24px;flex-wrap:wrap;margin-bottom:clamp(36px,6vw,72px);border-bottom:1px solid var(--line);padding-bottom:28px}
.sec-head p{max-width:40ch;color:var(--muted);margin:0;font-size:15px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid color-mix(in srgb,var(--ink) 30%,transparent);background:transparent;color:var(--ink);padding:11px 18px;border-radius:4px;font-weight:500;font-size:14px;cursor:pointer;text-decoration:none;transition:background .2s,color .2s,border-color .2s,box-shadow .2s;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.yellow{background:var(--ink);color:#050505;border-color:var(--ink)}
.btn.yellow:hover{background:#fff;box-shadow:0 0 0 4px var(--glow-soft),0 0 30px var(--glow)}
.btn.dark{background:var(--red);border-color:var(--red);color:#fff}
.btn.dark:hover{box-shadow:0 0 26px var(--glow)}
.btn.sm{padding:7px 13px;font-size:13px}
.btn.plain:hover{background:var(--bg-2)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.danger.solid{background:var(--danger);color:#fff}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.tape,.sticker,.scribble{display:none}

/* nav */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(14px)}
.bar .wrap{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px 24px;min-height:68px;padding-block:10px}
.logo{font:600 15px/1 var(--f-display);text-transform:uppercase;letter-spacing:.04em;text-decoration:none;display:flex;gap:10px;align-items:center}
.logo i{display:none}
.nav{display:flex;gap:clamp(18px,4vw,64px);justify-content:center}
.nav a{text-decoration:none;font:500 10px/1.35 var(--f-mono);text-transform:uppercase;letter-spacing:.12em;color:var(--muted);text-align:center;transition:color .2s}
.nav a b{display:block;color:var(--ink);font-weight:500}
.nav a:hover{color:var(--ink)}
.bar-actions{display:flex;justify-content:flex-end;gap:8px}
.owner-strip{background:var(--bg-2);border-bottom:1px solid var(--line);font-size:13px;color:var(--muted)}
.owner-strip b{color:var(--ink)}
.owner-strip .wrap{display:flex;gap:10px 16px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding-block:8px}
.owner{display:flex;gap:8px;flex-wrap:wrap}

/* hero */
.hero{padding-block:clamp(24px,4vw,40px) clamp(48px,7vw,80px);isolation:isolate}
.embers{position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none}
.hero-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(24px,4vw,56px);align-items:center;min-height:min(78vh,760px)}
.status{display:inline-flex;align-items:center;gap:10px;font:500 11px/1 var(--f-mono);text-transform:uppercase;letter-spacing:.14em;color:var(--muted);margin-bottom:28px}
.status i{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok)}
.status.off i{background:var(--muted);box-shadow:none}
.hero h1{font-size:clamp(46px,7.4vw,104px);line-height:.92;font-weight:500;text-transform:uppercase;letter-spacing:-.035em}
.hero h1,.hero .intro,.hero .cta,.status{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
.hero .intro{animation-delay:.15s}.hero .cta{animation-delay:.25s}
@keyframes rise{from{transform:translateY(24px);opacity:.001}}
.hero-visual img{animation:ignite 1.6s ease-out both}
@keyframes ignite{from{opacity:.001;filter:grayscale(1) brightness(.2)}}
.hero .intro{font-size:15px;color:color-mix(in srgb,var(--ink) 78%,transparent);max-width:42ch;margin:26px 0 34px;line-height:1.55}
.cta{display:flex;gap:10px;flex-wrap:wrap}
.hero-visual{transition:transform .25s ease-out;will-change:transform;position:relative;align-self:end;justify-self:center;width:100%;max-width:560px;aspect-ratio:4/5}
.hero-visual::before{content:"";position:absolute;inset:8% 4% 0;background:radial-gradient(closest-side,rgba(255,59,47,.38),rgba(255,59,47,.08) 60%,transparent);filter:blur(30px);z-index:-1;animation:breathe 6s ease-in-out infinite}
@keyframes breathe{50%{opacity:.6;transform:scale(.96)}}
.hero-visual img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:bottom center;
  filter:grayscale(1) contrast(1.25) brightness(.78) drop-shadow(0 0 1.5px var(--red)) drop-shadow(0 0 14px rgba(255,59,47,.75)) drop-shadow(0 0 46px rgba(255,59,47,.35));
  -webkit-mask-image:linear-gradient(#000 70%,transparent 99%);mask-image:linear-gradient(#000 70%,transparent 99%)}
.hero-visual img.rect{object-fit:cover;border-radius:6px;-webkit-mask-image:radial-gradient(closest-side,#000 62%,transparent);mask-image:radial-gradient(closest-side,#000 62%,transparent)}
.hero-visual .tint{position:absolute;inset:0;background:linear-gradient(200deg,rgba(255,59,47,.0) 30%,rgba(255,59,47,.18));mix-blend-mode:screen;pointer-events:none}
.hero-visual .mono{position:absolute;inset:0;display:grid;place-items:center;font:500 clamp(120px,20vw,240px)/1 var(--f-display);color:transparent;-webkit-text-stroke:1.5px var(--red);text-shadow:0 0 40px var(--glow)}
.callout{position:absolute;font:500 10px/1.35 var(--f-mono);text-transform:uppercase;letter-spacing:.12em;color:var(--muted);display:flex;gap:10px;align-items:center}
.callout::before{content:"";width:34px;height:1px;background:linear-gradient(90deg,var(--red),transparent)}
.callout b{display:block;color:var(--ink);font-weight:500}
.callout.c1{left:-6%;top:74%}
.callout.c2{right:-4%;top:12%;flex-direction:row-reverse;text-align:right}
.callout.c2::before{background:linear-gradient(270deg,var(--red),transparent)}
.upload-hint{position:absolute;inset:auto 0 10% 0;display:flex;justify-content:center;z-index:5}
.hero-foot{display:flex;justify-content:space-between;gap:12px 24px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:18px;font:500 10px/1.4 var(--f-mono);text-transform:uppercase;letter-spacing:.14em;color:var(--muted)}
.hero-foot b{color:var(--ink);font-weight:500}

/* marquee */
.band-clip{overflow:hidden;border-block:1px solid var(--line)}
.band-track{display:flex;width:max-content;animation:scroll 46s linear infinite}
.band-track span{font:500 clamp(22px,3vw,40px)/1 var(--f-display);text-transform:uppercase;letter-spacing:-.02em;padding:22px 26px;white-space:nowrap;display:flex;align-items:center;gap:26px;color:color-mix(in srgb,var(--ink) 85%,transparent)}
.band-track span:nth-child(odd){color:transparent;-webkit-text-stroke:1px color-mix(in srgb,var(--ink) 55%,transparent)}
.band-track span::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--red);box-shadow:0 0 12px var(--red)}
@keyframes scroll{to{transform:translateX(-50%)}}
.trusted{display:flex;align-items:center;gap:14px 34px;flex-wrap:wrap;margin-top:28px;color:var(--muted)}
.trusted b{font:500 10px/1 var(--f-mono);text-transform:uppercase;letter-spacing:.14em}
.trusted span{font:500 18px/1 var(--f-display);text-transform:uppercase;color:var(--ink);opacity:.6}

/* projects */
.projects{display:grid;gap:clamp(72px,10vw,140px)}
.proj{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.2fr);gap:clamp(28px,5vw,80px);align-items:center}
.proj.flip .proj-text{order:2}
.num{font:500 12px/1 var(--f-mono);letter-spacing:.14em;color:var(--red);display:block;margin-bottom:20px}
.num::before{content:"( "}.num::after{content:" )"}
.tagrow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tag{font:500 10px/1 var(--f-mono);text-transform:uppercase;letter-spacing:.12em;padding:6px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.tag.pink{border-color:color-mix(in srgb,var(--red) 40%,transparent);color:var(--red)}
.proj h3{font-size:clamp(32px,4.2vw,56px);line-height:.95;font-weight:500;text-transform:uppercase;letter-spacing:-.03em}
.proj .sum{color:var(--muted);margin:18px 0 22px;max-width:44ch}
.role{display:grid;gap:4px;margin-bottom:28px}
.role b{font:500 10px/1 var(--f-mono);text-transform:uppercase;letter-spacing:.14em;color:var(--muted)}
.role span{color:var(--ink)}
.stage{position:relative;border-radius:14px;border:1px solid var(--line);background:radial-gradient(70% 60% at 50% 65%,rgba(255,59,47,.22),transparent 70%),var(--bg-2);aspect-ratio:5/4;max-width:100%;overflow:hidden;cursor:pointer;transition:border-color .3s}
.stage:hover,.stage:focus-visible{border-color:color-mix(in srgb,var(--red) 55%,transparent);box-shadow:0 0 0 1px rgba(255,59,47,.25),0 0 70px rgba(255,59,47,.16)}
.proj h3{transition:color .3s}.proj:hover h3{color:#fff;text-shadow:0 0 30px rgba(255,59,47,.35)}
.svc{box-shadow:inset 0 0 0 1px transparent;transition:background .3s,box-shadow .3s}.svc:hover{box-shadow:inset 0 0 0 1px rgba(255,59,47,.45)}
.tcard,.ach{transition:border-color .3s,box-shadow .3s}.tcard:hover,.ach:hover{border-color:rgba(255,59,47,.45);box-shadow:0 0 50px rgba(255,59,47,.1)}
.stage .shot{position:absolute;background:var(--card);border:1px solid #2c2c31;border-radius:12px;overflow:hidden;transition:transform .6s cubic-bezier(.2,.7,.2,1),box-shadow .6s;box-shadow:0 30px 60px rgba(0,0,0,.6)}
.stage .shot img{width:100%;height:100%;object-fit:cover;object-position:top center;display:block}
.stage .shot.a{width:46%;aspect-ratio:9/19;left:14%;top:12%;transform:rotate(-5deg)}
.stage .shot.b{width:42%;aspect-ratio:9/19;right:12%;top:20%;transform:rotate(4deg)}
.stage .shot.wide{width:82%;aspect-ratio:16/10;left:9%;top:15%}
.stage .shot.wide.b2{width:50%;left:auto;right:5%;top:52%}
.stage:hover .shot{box-shadow:0 30px 70px rgba(0,0,0,.6),0 0 40px rgba(255,59,47,.25)}
.stage:hover .shot.a{transform:rotate(-2deg) translateY(-8px)}
.stage:hover .shot.b{transform:rotate(1deg) translateY(-14px)}
.stage:hover .shot.wide{transform:translateY(-8px)}
.ex-badge{position:absolute;right:14px;bottom:14px;z-index:4;font:500 10px/1 var(--f-mono);letter-spacing:.14em;color:var(--muted);border:1px solid var(--line);padding:6px 10px;border-radius:999px;background:var(--bg)}
.examples-note{display:flex;gap:12px 18px;align-items:center;justify-content:space-between;flex-wrap:wrap;border:1px dashed color-mix(in srgb,var(--red) 50%,transparent);background:var(--glow-soft);border-radius:10px;padding:14px 18px;margin-bottom:56px;font-size:14px}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 13px;font:500 11px/1.2 var(--f-mono);text-transform:uppercase;letter-spacing:.1em;cursor:pointer;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:#050505;border-color:var(--ink)}

.fx{position:absolute;inset:0;padding:10px;display:flex;flex-direction:column;gap:7px}
.fx .l{height:6px;border-radius:3px;background:#2a2a2f}
.fx .k{border-radius:6px;background:#17171a;border:1px solid #2a2a2f}
.fx .y{background:var(--red);border-color:var(--red);box-shadow:0 0 14px var(--glow)}

/* services */
.services{background:var(--bg)}
.svc-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.svc{position:relative;background:var(--bg);padding:34px 28px;display:flex;flex-direction:column;gap:16px;min-width:0;transition:background .3s}
.svc:hover{background:radial-gradient(80% 60% at 50% 0%,rgba(255,59,47,.12),transparent 70%),var(--bg)}
.svc h3{font-size:26px;line-height:1;font-weight:500;text-transform:uppercase;letter-spacing:-.02em}
.svc-desc{color:var(--muted);margin:0;font-size:15px}
.meta{display:flex;gap:8px;flex-wrap:wrap}
.meta span{font:500 10px/1 var(--f-mono);text-transform:uppercase;letter-spacing:.12em;padding:6px 10px;border-radius:999px;border:1px solid var(--line);color:var(--ink)}
.svc ul{list-style:none;padding:0;margin:0;display:grid;gap:10px;flex:1;font-size:15px}
.svc li{display:flex;gap:12px;align-items:baseline}
.svc li::before{content:"";flex:none;width:12px;height:1px;background:var(--red);transform:translateY(-4px)}

/* about */
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(40px,7vw,100px);align-items:start}
.bio{font-size:20px;line-height:1.55;margin:0 0 36px;max-width:40ch;white-space:pre-line}
.skill-group{margin-bottom:24px}
.skill-group b{display:block;font:500 10px/1 var(--f-mono);text-transform:uppercase;letter-spacing:.14em;color:var(--muted);margin-bottom:12px}
.pills{display:flex;flex-wrap:wrap;gap:8px;list-style:none;margin:0;padding:0}
.pills li{padding:7px 13px;border-radius:999px;border:1px solid var(--line);font-size:14px}
.principles{list-style:none;margin:0;padding:0;counter-reset:p}
.principles li{display:grid;grid-template-columns:64px 1fr;gap:16px;padding:24px 0;border-top:1px solid var(--line);counter-increment:p}
.principles li:last-child{border-bottom:1px solid var(--line)}
.principles li::before{content:"( " counter(p,decimal-leading-zero) " )";font:500 11px/1.9 var(--f-mono);color:var(--red);letter-spacing:.08em}
.principles h3{font-size:20px;font-weight:500;text-transform:uppercase;letter-spacing:-.01em;margin-bottom:6px}
.principles p{margin:0;color:var(--muted);font-size:15px}

/* testimonials */
.tgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.tcard{position:relative;background:var(--bg-2);border:1px solid var(--line);border-radius:14px;padding:28px 24px;display:flex;flex-direction:column;gap:22px;min-width:0}
.tcard blockquote{margin:0;font-size:17px;line-height:1.6;flex:1}
.tcard blockquote::before{content:"“";display:block;font:500 54px/.6 var(--f-display);color:var(--red);text-shadow:0 0 20px var(--glow);margin-bottom:8px}
.who{display:flex;gap:12px;align-items:center}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--red);color:var(--ink);font:500 13px/1 var(--f-mono);flex:none;box-shadow:0 0 14px var(--glow-soft)}
.who b{display:block;line-height:1.2;font-weight:500}
.who span{color:var(--muted);font-size:13px}
.owner-empty{border:1px dashed var(--line);border-radius:14px;padding:26px;text-align:center;color:var(--muted);display:grid;gap:12px;justify-items:center;font-size:14px}

/* achievements */
.agrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px}
.ach{border:1px solid var(--line);border-radius:14px;padding:24px;background:var(--bg-2);display:grid;gap:10px}
.ach .star{width:10px;height:10px;border-radius:50%;background:var(--red);box-shadow:0 0 14px var(--red);font-size:0}
.ach h3{font-size:18px;font-weight:500;text-transform:uppercase}
.ach p{margin:0;color:var(--muted);font-size:15px}

/* contact */
.contact{position:relative;border:1px solid var(--line);border-radius:20px;padding:clamp(30px,6vw,80px);display:grid;gap:24px;overflow:hidden;background:radial-gradient(60% 80% at 85% 110%,rgba(255,59,47,.35),transparent 70%),var(--bg-2)}
.contact h2{font-size:clamp(44px,7.4vw,104px);max-width:12ch}
.contact h2 .hl{background:none!important;padding:0!important}
.contact p{margin:0;color:var(--muted);max-width:46ch}
.contact .hand{position:absolute;right:clamp(16px,5vw,60px);top:clamp(18px,4vw,40px)}
.email-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.email{font:500 clamp(20px,3vw,32px)/1.1 var(--f-display);user-select:all;overflow-wrap:anywhere}
footer{padding-block:30px 50px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;color:var(--muted);font:500 10px/1.6 var(--f-mono);text-transform:uppercase;letter-spacing:.12em}
footer nav{display:flex;gap:18px;flex-wrap:wrap}
footer a{text-decoration:none}
footer a:hover{color:var(--ink)}

/* case study overlay */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(5,5,5,.82);backdrop-filter:blur(8px);overflow-y:auto;padding:max(16px,env(safe-area-inset-top,0px)) 16px max(16px,env(safe-area-inset-bottom,0px))}
.sheet{max-width:1080px;margin:20px auto;background:var(--bg-2);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.sheet-head{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap;position:sticky;top:0;background:var(--bg-2);z-index:2}
.sheet-body{padding:clamp(20px,4vw,52px);display:grid;gap:30px}
.cs-title{font-size:clamp(38px,6vw,80px);line-height:.92;font-weight:500;text-transform:uppercase;letter-spacing:-.03em}
.cs-facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:18px;border-block:1px solid var(--line);padding-block:18px;margin:0}
.cs-facts dt{font:500 10px/1 var(--f-mono);text-transform:uppercase;letter-spacing:.14em;color:var(--muted);margin-bottom:8px}
.cs-facts dd{margin:0}
.cs-text{font-size:18px;line-height:1.7;max-width:64ch;white-space:pre-line;margin:0;color:color-mix(in srgb,var(--ink) 85%,transparent)}
.cs-images{display:grid;gap:22px}
.cs-images figure{margin:0}
.cs-images img{width:100%;border-radius:12px;border:1px solid var(--line);background:var(--card);display:block;height:auto}
.confirm{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:rgba(255,90,90,.08);border:1px solid var(--danger);border-radius:10px;padding:12px 14px}

/* drawers */

async function processImage(file, max){
  const bmp = await createImageBitmap(file);
  const scale = Math.min(1, (max||2000) / bmp.width);
  const w = Math.round(bmp.width*scale), hh = Math.round(bmp.height*scale);
  const c = document.createElement("canvas"); c.width=w; c.height=hh;
  c.getContext("2d").drawImage(bmp,0,0,w,hh);

  if (!blob || blob.type!=="image/webp"){ blob = await new Promise(r=>c.toBlob(r,"image/jpeg",0.88)); ext="jpg"; }
  return {blob, ext, w:bmp.width, h:bmp.height, preview:URL.createObjectURL(blob)};
}

  function draw(){
    thumbs.replaceChildren(...images.map((im,i)=>h("div",{class:"thumb"+(i===0?" cover":"")},
      h("img",{src: im.pending ? im.preview : src(im.path), alt:"Screen "+(i+1)}),
      h("div",{class:"tb"},
        i===0 ? h("button",{type:"button",disabled:true},"Cover") : h("button",{type:"button",onclick:()=>{images.unshift(images.splice(i,1)[0]);draw();}},"Make cover"),
        h("button",{type:"button","aria-label":"Remove image "+(i+1),onclick:()=>{const [r]=images.splice(i,1); if(!r.pending) removed.push(r.path); draw();}},"✕")))));
  }
  draw();
  const form = h("form",{onsubmit:async e=>{
      e.preventDefault();
      const fd = new FormData(form), title = (fd.get("title")||"").trim();
      if (!title){ toast("Give the project a title."); return; }
      if (!images.length){ toast("Add at least one image."); return; }
      const files = {};
      const finalImages = images.map(im=>{
        if (!im.pending) return {path:im.path,w:im.w,h:im.h};
        const path = `works/${w.id}/${slug(title)}-${uid()}.${im.ext}`;
        files[path] = im.blob; blobUrls[path] = im.preview;
        return {path,w:im.w,h:im.h};
      });
      removed.forEach(p=>{ files[p]=null; });
      const updated = {...w, title, category:fd.get("category"), year:(fd.get("year")||"").trim(), role:(fd.get("role")||"").trim(), tools:(fd.get("tools")||"").trim(),
        summary:(fd.get("summary")||"").trim(), description:(fd.get("description")||"").trim(), link:cleanUrl(fd.get("link")), prototype:cleanUrl(fd.get("prototype")), images:finalImages, created:w.created||Date.now()};
      const next = clone(state);
      const idx = next.works.findIndex(x=>x.id===w.id);
      if (idx>=0) next.works[idx]=updated; else next.works.unshift(updated);
      if (await save(next, files, existing ? "Project updated" : "Project published")){ closeOverlays(); render(); }
    }},
    h("header",{}, h("h3",{}, existing ? "Edit project" : "Add a project"), h("button",{class:"btn sm plain",type:"button",onclick:closeOverlays},"Cancel")),
    h("div"),
    h("div",{class:"fields"},
      h("div",{class:"field"}, h("span",{class:"lbl"},"Screens"), drop, fileInput, thumbs),
      field("wf-title","Project title", h("input",{type:"text",id:"wf-title",name:"title",value:w.title,required:true,placeholder:"e.g. AgrovanT crop guide app"})),
      h("div",{class:"row2"},
        field("wf-cat","Category", h("select",{id:"wf-cat",name:"category"}, CATS.map(c=>h("option",{value:c,selected:c===w.category},c)))),
        field("wf-year","Year", inp("wf-year","year",w.year))),
      field("wf-summary","One-line summary", h("input",{type:"text",id:"wf-summary",name:"summary",value:w.summary,maxlength:"180",placeholder:"What it is and who it's for"})),
      h("div",{class:"row2"},
        field("wf-role","My role", inp("wf-role","role",w.role,"UI design")),
        field("wf-tools","Tools", inp("wf-tools","tools",w.tools,"Figma, FigJam"))),
      field("wf-desc","Case study", h("textarea",{id:"wf-desc",name:"description",placeholder:"The problem, your process and the result."}, w.description), "Line breaks are kept."),
      field("wf-proto","Prototype link", inp("wf-proto","prototype",w.prototype,"Figma prototype link (figma.com/proto/…)","url"), "Adds a “View prototype” button."),
      field("wf-link","Other link", inp("wf-link","link",w.link,"Live site, Behance or Dribbble","url"))
    ),
    h("div",{class:"foot"}, h("small",{},"Saving publishes a new version of this page."), h("button",{class:"btn yellow",type:"submit"}, existing ? "Save changes" : "Publish project"))
  );
  openDrawer(form, "#wf-title");
}

/* ---------- edit page (tabs) ---------- */
function repeater(list, defs, blank, label){
  const box = h("div",{style:"display:grid;gap:12px"});
  function draw(){
    box.replaceChildren(
      ...list.map((item,i)=>h("div",{class:"rep-item"},
        h("div",{class:"rep-top"}, h("b",{},label+" "+(i+1)),
          h("div",{},
            i>0 ? h("button",{class:"icon-btn",type:"button","aria-label":"Move up",onclick:()=>{list.splice(i-1,0,list.splice(i,1)[0]);draw();}},"↑") : null,
            h("button",{class:"icon-btn",type:"button",onclick:()=>{list.splice(i,1);draw();}},"Remove"))),
        defs.map(d=>{
          const id = `rp-${label.replace(/\W/g,"")}-${i}-${d.key}`;
          const val = d.list ? (item[d.key]||[]).join("\n") : (item[d.key]||"");
          const el = d.area||d.list ? h("textarea",{id,style:"min-height:"+(d.list?"96px":"80px")},val) : h("input",{type:"text",id,value:val,placeholder:d.ph||""});
          el.addEventListener("input",()=>{ item[d.key] = d.list ? el.value.split("\n").map(x=>x.trim()).filter(Boolean) : el.value; });
          return field(id,d.label,el,d.hint);
        })
      )),
      h("button",{class:"btn sm plain",type:"button",onclick:()=>{list.push(clone(blank));draw();}},"+ Add "+label.toLowerCase())
    );
  }
  draw();
  return box;
}
function openPageForm(startTab){
  closeOverlays();
  const d = clone(state);
  const p = d.profile; p.links = p.links||{};
  let portraitNew = null, portraitRemoved = false;
  const bind = (obj,key) => e => { obj[key] = e.target.type==="checkbox" ? e.target.checked : e.target.value; };
  const tf = (id,label,obj,key,ph,type,hint) => field(id,label,h("input",{type:type||"text",id,value:obj[key]||"",placeholder:ph||"",oninput:bind(obj,key)}),hint);
  const ta = (id,label,obj,key,hint) => field(id,label,h("textarea",{id,oninput:bind(obj,key)},obj[key]||""),hint);

  const photoBox = h("div",{class:"ph"});
  const drawPhoto = ()=>{ const s = portraitNew ? portraitNew.preview : (!portraitRemoved && p.portrait ? src(p.portrait.path) : null); photoBox.replaceChildren(s ? h("img",{src:s,alt:"Your photo"}) : initials(p.name)); };
  const [pDrop,pInput] = dropZone(async fl=>{ const f=[...fl].find(f=>f.type.startsWith("image/")); if(!f) return; try{ portraitNew = await processImage(f,1000); drawPhoto(); }catch(e){ toast("Couldn't read that image."); } }, false, "A square or portrait photo works best.");
  drawPhoto();

  const panels = {
    "Profile": [
      h("div",{class:"field"}, h("span",{class:"lbl"},"Photo"), h("div",{class:"pf-photo"}, photoBox, h("div",{style:"flex:1;min-width:200px;display:grid;gap:8px"}, pDrop, pInput,
        h("button",{class:"btn sm plain",type:"button",onclick:()=>{portraitNew=null;portraitRemoved=true;drawPhoto();}},"Remove photo")))),
      h("div",{class:"row2"}, tf("pf-name","Name",p,"name"), tf("pf-role","Role",p,"role","UI Designer")),
      h("div",{class:"row2"}, tf("pf-loc","Location",p,"location","City, Country"), tf("pf-email","Email",p,"email","you@example.com","email")),
      tf("pf-wa","WhatsApp number",p,"whatsapp","+234…","text","Used by the “Chat on WhatsApp” and “Book a call” buttons."),
      h("label",{class:"toggle",for:"pf-av"}, h("input",{type:"checkbox",id:"pf-av",checked:!!p.available,onchange:bind(p,"available")}), "Show “Available for new projects”"),
      tf("pf-head","Headline",p,"headline","","text","The big line at the top. The last two words get a yellow highlight."),
      ta("pf-intro","Intro",p,"intro","Two sentences under the headline."),
      ta("pf-bio","About me",p,"bio"),
      h("div",{class:"row2"}, tf("pf-book","Booking link",p,"bookingUrl","calendly.com/you","url","Used by every “Book a call” button."), tf("pf-cv","Resume link",p,"resumeUrl","Google Drive or PDF link","url")),
      h("div",{class:"row2"}, tf("pf-dr","Dribbble",p.links,"dribbble","dribbble.com/you","url"), tf("pf-be","Behance",p.links,"behance","behance.net/you","url")),
      h("div",{class:"row2"}, tf("pf-li","LinkedIn",p.links,"linkedin","linkedin.com/in/you","url"), tf("pf-x","X (Twitter)",p.links,"x","x.com/you","url")),
      tf("pf-web","Website",p.links,"website","","url"),
      field("pf-co","Companies you've worked with",h("textarea",{id:"pf-co",style:"min-height:80px",oninput:e=>{d.companies=splitList(e.target.value);}},d.companies.join("\n")),"One per line. Shown as a “Trusted by” row. Leave empty to hide it.")
    ],
    "Services": [repeater(d.services,[{key:"title",label:"Title"},{key:"price",label:"Price",ph:"e.g. From ₦250,000"},{key:"duration",label:"Timeline",ph:"e.g. 2–4 weeks"},{key:"description",label:"Description",area:true},{key:"items",label:"What's included",list:true,hint:"One per line."}],{title:"",price:"",duration:"",description:"",items:[]},"Service")],
    "Skills": [repeater(d.skills,[{key:"group",label:"Group name",ph:"e.g. Tools"},{key:"items",label:"Skills",list:true,hint:"One per line."}],{group:"",items:[]},"Group")],
    "Principles": [repeater(d.principles,[{key:"title",label:"Title"},{key:"text",label:"Text",area:true}],{title:"",text:""},"Principle")],
    "Testimonials": [h("p",{class:"hint",style:"margin:0"},"Use real quotes, with permission from the person."), repeater(d.testimonials,[{key:"name",label:"Name"},{key:"role",label:"Role and company",ph:"e.g. Founder, Agrovant"},{key:"quote",label:"Quote",area:true}],{name:"",role:"",quote:""},"Testimonial")],
    "Achievements": [repeater(d.achievements,[{key:"title",label:"Title"},{key:"text",label:"Details",area:true}],{title:"",text:""},"Achievement")]
  };
  const names = Object.keys(panels);
  let current = names.includes(startTab) ? startTab : "Profile";
  const body = h("div",{class:"fields"});
  const tabs = h("div",{class:"tabs",role:"tablist"});
  const nodes = {}; names.forEach(n=>{ nodes[n] = h("div",{style:"display:grid;gap:18px"}, panels[n]); });
  function show(){ tabs.replaceChildren(...names.map(n=>h("button",{type:"button",role:"tab","aria-selected":String(n===current),onclick:()=>{current=n;show();}},n))); body.replaceChildren(nodes[current]); body.scrollTop=0; }
  show();
  const form = h("form",{onsubmit:async e=>{
      e.preventDefault();
      const files = {};
      ["resumeUrl","bookingUrl"].forEach(k=>p[k]=cleanUrl(p[k]));
      Object.keys(p.links).forEach(k=>p.links[k]=cleanUrl(p.links[k]));
      ["name","role","location","headline","email","whatsapp"].forEach(k=>p[k]=(p[k]||"").trim());
      d.services = d.services.filter(s=>(s.title||"").trim());
      d.skills = d.skills.filter(s=>(s.group||"").trim() && s.items.length);
      d.principles = d.principles.filter(s=>(s.title||"").trim());
      d.testimonials = d.testimonials.filter(s=>(s.name||"").trim() && (s.quote||"").trim());
      d.achievements = d.achievements.filter(s=>(s.title||"").trim());
      const old = state.profile.portrait;
      if (portraitNew){
        const path = `profile/portrait-${uid()}.${portraitNew.ext}`;
        files[path] = portraitNew.blob; blobUrls[path] = portraitNew.preview;
        p.portrait = {path,w:portraitNew.w,h:portraitNew.h};
        if (old) files[old.path] = null;
        if (p.portraitCut){ files[p.portraitCut.path] = null; p.portraitCut = null; }
      } else if (portraitRemoved){ p.portrait = null; if (old) files[old.path] = null; if (p.portraitCut){ files[p.portraitCut.path] = null; p.portraitCut = null; } }
      d.works = state.works;
      if (await save(d, files, "Page updated")){ closeOverlays(); render(); }
    }},
    h("header",{}, h("h3",{},"Edit page"), h("button",{class:"btn sm plain",type:"button",onclick:closeOverlays},"Cancel")),
    tabs, body,
    h("div",{class:"foot"}, h("small",{},"Changes on every tab are saved together."), h("button",{class:"btn yellow",type:"submit"},"Save page"))
  );
  openDrawer(form);
}
function openDrawer(form, focusSel){
  const dr = h("div",{class:"drawer",onclick:e=>{ if(e.target===dr) closeOverlays(); }}, form);
  document.body.append(dr); document.body.style.overflow="hidden";
  (focusSel ? form.querySelector(focusSel) : form.querySelector("input,textarea,button"))?.focus();
}

/* ---------- delete + save ---------- */
async function deleteWork(w){
  const next = clone(state);
  next.works = next.works.filter(x=>x.id!==w.id);
  const files = {}; (w.images||[]).forEach(im=>{ files[im.path]=null; });
  if (await save(next, files, "Project deleted")){ closeOverlays(); render(); }
}
async function save(next, files, okMsg){
  if (!artifactApi || busy) return false;
  busy = true;
  const btns = [...document.querySelectorAll('.drawer button[type=submit], .confirm .danger.solid')];
  btns.forEach(b=>{b.disabled=true; b.dataset.label=b.textContent; b.textContent="Saving…";});
  try{
    await artifactApi.publish({...files, "data/portfolio.json": JSON.stringify(next, null, 1)});
    state = next; toast(okMsg); return true;
  }catch(err){
    const code = err && err.code;
    if (code==="conflict") toast("A newer version was saved elsewhere. Loading it now.");
    else if (["not_writer","not_granted","consent_required"].includes(code)){ canEdit=false; closeOverlays(); render(); toast("This view is read-only."); }
    else if (code==="capability_disabled"||code==="capability_removed") toast("Saving isn't available in this view. Open the page from your Claude account to edit.");
    else if (code==="too_large") toast("Those images are too large. Try fewer or smaller images.");
    else if (code==="rate_limited") toast("Saving too quickly. Wait a moment and try again.");
    else toast("Couldn't save. Check your connection and try again.");
    return false;
  }finally{
    busy = false;
    btns.forEach(b=>{b.disabled=false; if(b.dataset.label) b.textContent=b.dataset.label;});
  }
}

/* ---------- boot ---------- */
function load(d){
  const out = clone(DEFAULT);
  Object.keys(out).forEach(k=>{ if (k!=="profile" && Array.isArray(d[k])) out[k]=d[k]; });
  out.profile = {...out.profile, ...(d.profile||{}), links:{...out.profile.links, ...((d.profile||{}).links||{})}};
  // migrate first-version fields
  if (d.profile && Array.isArray(d.profile.tools) && !Array.isArray(d.skills)) out.skills=[{group:"Tools",items:d.profile.tools}];
  delete out.profile.services; delete out.profile.tools;
  return out;
}
render();
function setLoaderName(n){ const el=document.getElementById("loader-name"); if(!el||!n||el.textContent===n.toUpperCase()) return; el.replaceChildren(...[...n.toUpperCase()].map((ch,i)=>h("span",{style:`animation-delay:${i*.04}s`}, ch===" "?"\u00a0":ch))); }
fetch("data/portfolio.json",{cache:"no-store"}).then(r=>r.ok?r.json():null).then(d=>{ if (d){ state = load(d); render(); setLoaderName(state.profile.name); } }).catch(()=>{});
(async()=>{
  try{
    if (!window.claude?.use) return;
    const [a,u] = await Promise.all([claude.use("artifact"), claude.use("user")]);
    if (a && u && await u.canEdit()){ artifactApi = a; canEdit = true; render(); }
  }catch(e){}
})();
})();
</script>
